<div class="lang">
  <button
    type="button"
    class="lang__trigger"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    [attr.aria-label]="'common.language_switcher.aria' | transloco"
    [pTooltip]="currentName()"
    tooltipPosition="bottom"
    (click)="toggle()"
  >
    <span class="lang__code">{{ current().toUpperCase() }}</span>
  </button>

  @if (open()) {
    <ul class="lang__panel" role="menu" [attr.aria-label]="'common.language_switcher.aria' | transloco">
      @for (l of languages; track l.code; let i = $index) {
        <li role="none">
          <button
            #menuitem
            type="button"
            role="menuitem"
            [attr.lang]="l.code"
            [attr.aria-label]="l.name"
            class="lang__option"
            [class.lang__option--active]="l.code === current()"
            [attr.aria-current]="l.code === current() ? 'true' : null"
            (click)="select(l.code)"
          >
            <span class="lang__option-code">{{ l.short }}</span>
            @if (l.code === current()) {
              <i class="pi pi-check" aria-hidden="true"></i>
            }
          </button>
        </li>
      }
    </ul>
  }
</div>
