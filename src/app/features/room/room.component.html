<section class="page room" #roomEl [class.room--custom-bg]="hasCustomBackground()"
         [style.--table-felt]="feltColor()" [style.--table-felt-image]="feltImage()"
         [style.--room-bg]="backgroundColor()" [style.--room-bg-image]="backgroundImage()">
  <header class="room-header">
    <div class="rh-left">
      <p-button [label]="'action.back' | transloco" icon="pi pi-arrow-left" [text]="true" severity="secondary" (onClick)="quit()" />
    </div>
    <h1 class="rh-title">{{ socket.roomTitle() || ('room.untitled' | transloco) }}</h1>
    <div class="rh-right">
      <p-button [label]="code()" icon="pi pi-copy" [outlined]="true" severity="secondary" (onClick)="copyCode()" />
      <p-button icon="pi pi-qrcode" [ariaLabel]="'room.qr.open' | transloco" [pTooltip]="'room.qr.open' | transloco"
                [outlined]="true" severity="secondary" (onClick)="openQr()" />
      <p-button [label]="'room.share' | transloco" icon="pi pi-share-alt" [outlined]="true" severity="secondary" (onClick)="shareLink()" />
      <p-button [icon]="isFullscreen() ? 'pi pi-window-minimize' : 'pi pi-window-maximize'"
                [ariaLabel]="(isFullscreen() ? 'room.exit_fullscreen' : 'room.fullscreen') | transloco"
                [outlined]="true" severity="secondary" (onClick)="toggleFullscreen()" />
    </div>
  </header>

  @if (socket.deckSnapshot(); as deck) {
    <div class="room-body" [class.has-panel]="showPanel()">
      <!-- L'activite est resolue par le registre, jamais nommee ici. -->
      <ng-container *ngComponentOutlet="activity().board" />

      <!-- Facilitator panel (right) -->
      @if (isFacilitator()) {
        <ng-container *ngComponentOutlet="activity().panel" />
      } @else if (showPanel()) {
        <!-- Pas facilitateur, et personne ne l'est : le panneau se reduit a l'encart
             qui permet de reprendre le role. Meme condition que la grille (showPanel),
             sans quoi cet encart retomberait en pleine largeur sous la table. -->
        <aside class="fac-panel">
          <div class="panel-block guard">
            <span>{{ 'room.facilitator_absent' | transloco }}</span>
            <p-button [label]="'room.claim' | transloco" icon="pi pi-flag" size="small" (onClick)="socket.claimFacilitator()" />
          </div>
        </aside>
      }
    </div>
  }

  <!-- QR de jointure. Fond cliquable pour fermer ; la carte arrete le clic, sinon
       viser le QR refermerait la fenetre au lieu de le copier. -->
  @if (qrDataUrl(); as qr) {
    <div class="qr-overlay" (click)="closeQr()">
      <div class="qr-card" (click)="$event.stopPropagation()">
        <button type="button" class="qr-image" (click)="copyQr()">
          <img [src]="qr" [alt]="'room.qr.open' | transloco" />
        </button>
        <p class="qr-hint">{{ 'room.qr.copy_hint' | transloco }}</p>
      </div>
    </div>
  }
</section>
