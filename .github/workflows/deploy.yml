name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Keyed by ref so a PR's runs never queue behind (or cancel) a main deploy.
  # Superseded PR runs are cancelled; main deploys always run to completion.
  group: facilitation-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build (validate compile)
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # mint the OIDC token to assume the deploy role
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Verify build output
        run: test -f dist/Facilitation_frontend/browser/index.html

      - name: Package bundle
        id: pkg
        run: |
          tar -czf frontend-build.tar.gz -C dist/Facilitation_frontend/browser .
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Human version for the footer: short sha + build date (UTC).
          echo "version=$(git rev-parse --short HEAD) ($(date -u +%Y-%m-%d))" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Upload bundle to S3
        run: |
          aws s3 cp frontend-build.tar.gz \
            "s3://${{ secrets.S3_DEPLOY_BUCKET }}/builds/facilitation-frontend/${{ steps.pkg.outputs.sha }}.tar.gz"

      - name: Deploy on EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          BUCKET: ${{ secrets.S3_DEPLOY_BUCKET }}
          SHA: ${{ steps.pkg.outputs.sha }}
          FE_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          # AWS-RunShellScript runs as ROOT under dash. Installs config from the
          # COMMITTED git blob (never the django tree, §3.10) read from root's own bare
          # mirror (see M= below), pulls the S3 bundle via the
          # instance role (blank certbot creds), atomic-swaps the docroot, runs
          # the runtime-fetch (writes the SSM snippet), and reloads nginx.
          #
          # Le docroot garde UNE generation de chunks en plus de la courante.
          # Sans cela, `rsync --delete` effacait les anciens chunks a chaque
          # deploiement : un onglet ouvert avant le deploiement reclamait un
          # fichier disparu des que son proprietaire naviguait vers une route
          # pas encore visitee (POKER-FRONTEND-4). Le front sait desormais s'en
          # remettre (StaleChunkService), mais le mieux reste que ca n'arrive
          # pas : ici on sert current UNION previous.
          #
          # .bundle-current / .bundle-prev sont des copies PURES du bundle, pas
          # du docroot : sinon la retention s'empilerait indefiniment. Le
          # `--ignore-existing` du second rsync garantit que rien de l'ancienne
          # generation n'ecrase la nouvelle (index.html et i18n en particulier).
          APP=/var/www/django_websites/Facilitation_frontend
          DOC="$APP/dist/Facilitation_frontend/browser"
          # Root lit les blobs qu'il installe dans SON PROPRE miroir nu (root:root 700),
          # alimente depuis GitHub au SHA deploye — jamais dans le checkout django, dont
          # .git (refs, config, hooks) est reecrivable par django (escalade vers root).
          M=/var/lib/fleet-deploy/Facilitation_frontend.git
          GB="git --git-dir=$M show $SHA"
          # Ecritures dans l'arbre de django = EN DJANGO (§3.10). django possede
          # $APP : il pourrait y planter un lien symbolique pour qu'un rsync/tar/mv
          # de root ecrive dans /etc. Root ne fait donc que ce qui exige root
          # (miroir, units, nginx, systemctl). Le bundle S3, telecharge par root
          # (role d'instance) dans un mktemp -d prive (700), est passe a django sur
          # stdin (redirection ouverte par root) et extrait par django dans
          # dist/.bundle-new AVANT toute rotation (echec = arret, docroot intact),
          # puis tourne et publie par django. chown -R -h ne suit aucun lien ;
          # le chmod final tourne en django.
          cat > /tmp/ssm-params.json <<EOF
          { "commands": [
            "set -eu",
            "chown -R -h django:www-data $APP",
            "sudo -u django bash -c 'umask 027; cd $APP && git fetch --quiet origin main && git reset --hard --quiet origin/main'",
            "install -d -m 700 -o root -g root /var/lib/fleet-deploy",
            "[ -d $M ] || git init --quiet --bare $M",
            "git --git-dir=$M fetch --quiet --depth=1 https://github.com/Foxugly/Facilitation_frontend.git $SHA && git --git-dir=$M cat-file -e $SHA^{commit} || exit 1",
            "$GB:deploy/systemd/facilitation-frontend-runtime-fetch.service > /etc/systemd/system/facilitation-frontend-runtime-fetch.service",
            "$GB:deploy/fetch-frontend-runtime-from-ssm.sh > /usr/local/sbin/facilitation-frontend-runtime-fetch.sh && chmod 0755 /usr/local/sbin/facilitation-frontend-runtime-fetch.sh && chown root:root /usr/local/sbin/facilitation-frontend-runtime-fetch.sh",
            "$GB:deploy/nginx/facilitation-frontend.conf > /etc/nginx/sites-available/facilitation-frontend.conf && ln -sf /etc/nginx/sites-available/facilitation-frontend.conf /etc/nginx/sites-enabled/facilitation-frontend.conf",
            "systemctl daemon-reload && systemctl enable --quiet facilitation-frontend-runtime-fetch",
            "T=\$(mktemp -d) || exit 1",
            "env AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_CONFIG_FILE=/dev/null aws s3 cp s3://$BUCKET/builds/facilitation-frontend/$SHA.tar.gz \$T/facilitationfe.tar.gz --region eu-west-1",
            "sudo -u django sh -c 'umask 027; mkdir -p $APP/dist && rm -rf $APP/dist/.bundle-new && mkdir $APP/dist/.bundle-new && tar --no-same-owner --no-overwrite-dir -xzf - -C $APP/dist/.bundle-new' < \$T/facilitationfe.tar.gz || exit 1",
            "sudo -u django sh -c 'rm -rf $APP/dist/.bundle-prev; [ -d $APP/dist/.bundle-current ] && mv $APP/dist/.bundle-current $APP/dist/.bundle-prev || true'",
            "sudo -u django sh -c 'rm -rf $APP/dist/.bundle-current && mv $APP/dist/.bundle-new $APP/dist/.bundle-current'",
            "sudo -u django sh -c 'umask 027; mkdir -p $DOC && rsync -a --delete $APP/dist/.bundle-current/ $DOC/'",
            "sudo -u django sh -c '[ -d $APP/dist/.bundle-prev ] && rsync -a --ignore-existing $APP/dist/.bundle-prev/ $DOC/ || true'",
            "rm -rf \$T",
            "systemctl restart facilitation-frontend-runtime-fetch",
            "echo 'set \$facilitation_version \"$FE_VERSION\";' > /etc/nginx/snippets/facilitation-frontend-runtime-version.conf",
            "nginx -t && systemctl reload nginx",
            "chown -R -h django:www-data $APP && sudo -u django chmod -R g-w,o-rwx $APP"
          ], "executionTimeout": ["900"] }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy facilitation-frontend ${{ github.sha }}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy $STATUS"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out"; exit 1

      - name: Smoke test
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 -I https://facilitation.foxugly.com/ > /dev/null; then
              echo "Deployment OK (attempt $attempt)"; exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s..."; sleep 5
          done
          echo "Smoke test failed"; exit 1
